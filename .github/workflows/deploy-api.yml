name: deploy-api

# The web app deploys through Cloudflare Pages' Git integration (main -> production,
# other branches -> previews). This workflow deploys the Go API Worker + Container the
# same way: main -> dhd-api, other branches -> dhd-api-preview.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts, Containers and
# Durable Objects write) and CLOUDFLARE_ACCOUNT_ID. Without them the job is skipped.

on:
  push:
    paths:
      - apps/api/**
      - apps/edge/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref_name == 'main' && 'production' || 'preview' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the API deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
      - if: steps.creds.outputs.ok == 'true'
        working-directory: apps/api
        run: go test -race ./...
      - if: steps.creds.outputs.ok == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.creds.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.creds.outputs.ok == 'true' && github.ref_name == 'main'
        run: pnpm --filter @dhd/edge deploy
      - if: steps.creds.outputs.ok == 'true' && github.ref_name != 'main'
        run: pnpm --filter @dhd/edge deploy:preview
